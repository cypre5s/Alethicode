apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alethicode.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "alethicode.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  JUDGE_SERVER_TOKEN: {{ .Values.secrets.judgeServerToken | quote }}
  # Shared by Java backend and tutor_graph; overridden by ExternalSecrets in prod.
  INTERNAL_SERVICE_KEY: {{ .Values.secrets.internalServiceKey | default "dev-internal-key" | quote }}
  INTERNAL_SERVICE_PREVIOUS_KEY: {{ .Values.secrets.internalServicePreviousKey | default "" | quote }}
  # LLM provider keys.
  # OPENAI_API_KEY: DeepSeek-compatible chat / Java backend + tutor_graph + alethicode-rag.
  # EMBEDDING_API_KEY: 智谱 embedding-3, used ONLY by alethicode-rag (Phase 3 cutover removed
  # Java embedding usage). 旧 ADR-0004 中提到的 DashScope text-embedding-v4 已 deprecated。
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | default "" | quote }}
  EMBEDDING_API_KEY: {{ .Values.secrets.embeddingApiKey | default "" | quote }}
  INIT_LLM_API_KEY: {{ .Values.secrets.initLlmApiKey | default "" | quote }}
  # Phase 1 切流：Java backend 调 alethicode-rag 时 X-Internal-Token 头校验
  RAG_INTERNAL_TOKEN: {{ .Values.secrets.ragInternalToken | default .Values.secrets.internalServiceKey | default "dev-internal-key" | quote }}
  RAG_INTERNAL_PREVIOUS_TOKEN: {{ .Values.secrets.ragInternalPreviousToken | default .Values.secrets.internalServicePreviousKey | default "" | quote }}