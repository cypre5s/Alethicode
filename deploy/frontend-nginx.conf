# 2C4G 容量优化（2026-04-30）：把读多写少的 GET API 在 nginx 边缘做共享缓存。
# 配合 Phase 4 的 Service Worker 客户端缓存，跨用户走 nginx 缓存，单用户走 SW
# 缓存，最大限度减轻 backend 压力。

# 内存里 8MB 存缓存键索引（约 6 万个键），磁盘 256MB 存缓存内容；10 分钟无人访问就回收。
proxy_cache_path /var/cache/nginx/api
    levels=1:2
    keys_zone=api_cache:8m
    max_size=256m
    inactive=10m
    use_temp_path=off;

# HIGH-3 (2026-05-02 渗透报告): 单 IP 单线程 150 请求 → 17% timeout，
# 攻击者笔记本就能让其他用户体验崩溃。这里按 $binary_remote_addr 真实
# TCP 源 IP 做限流，攻击者无法用 X-Forwarded-For 轮换绕过（反正 backend
# 也只信 nginx 设置的 X-Real-IP）。
#   - api_zone:  常规 API,  10 r/s 持续 + burst 20
#   - auth_zone: 登录/注册/reset, 1 r/s 持续 + burst 5（已经有 backend 10/min
#               sensitive 限流，这里 nginx 边缘再压一道防爆破）
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:5m rate=1r/s;

upstream alethicode_backend {
    server backend:8080;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 64m;
  client_body_timeout 120s;
  keepalive_timeout 65s;
  keepalive_requests 200;

  access_log off;

  gzip on;
  gzip_min_length 1024;
  gzip_comp_level 4;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # === 维护模式 ===
  # 通过 host 路径 ./data/runtime/maintenance.flag 控制（挂载到容器内
  # /etc/nginx/runtime/maintenance.flag），存在则所有动态路由（/、/api/、
  # /ws/、/public/avatar/、/admin/）返回 503，error_page 跳到 @maintenance
  # 直接 serve 静态 maintenance.html。静态资源（js/css/png/svg 等）保持
  # 直通，让维护页能加载站点 logo。touch / rm flag 文件即时生效，无需
  # reload nginx。
  error_page 503 @maintenance;

  location @maintenance {
    internal;
    root /usr/share/nginx/html;
    try_files /maintenance.html =500;
    default_type text/html;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }

  # === 读多写少的 API：60s 共享缓存 ===
  # 题目列表/详情/公告/语言列表/站点配置：管理员变更频率低，60s 缓存对学生侧可接受
  # HIGH-3 + HIGH-4: 即便缓存命中 nginx 也会先做 limit_req（limit_req 比 cache 早执行），
  # 同时主动用 $remote_addr 覆盖客户端伪造的 XFF。
  location ~ ^/api/(problem|announcement|website|language)(/|$) {
    if (-f /etc/nginx/runtime/maintenance.flag) { return 503; }
    limit_req zone=api_zone burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://alethicode_backend;
    proxy_cache api_cache;
    proxy_cache_methods GET;
    proxy_cache_valid 200 60s;
    proxy_cache_valid 404 10s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_lock_age 8s;
    proxy_cache_key "$request_method$uri$is_args$args";
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
  }

  # === 提交列表：10s 短缓存 ===
  location ~ ^/api/submission(/|$) {
    if (-f /etc/nginx/runtime/maintenance.flag) { return 503; }
    limit_req zone=api_zone burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://alethicode_backend;
    proxy_cache api_cache;
    proxy_cache_methods GET;
    proxy_cache_valid 200 10s;
    proxy_cache_use_stale error timeout;
    proxy_cache_key "$request_method$uri$is_args$args";
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
  }

  # === 登录/注册/密码重置：先扛一道 nginx 限流（HIGH-3）===
  # backend 也有 sensitive 10/min 限流，但 nginx 边缘按真实 IP 限制更早拦截。
  location ~ ^/api/(login|register|apply-reset-password|reset-password)(/|$) {
    if (-f /etc/nginx/runtime/maintenance.flag) { return 503; }
    limit_req zone=auth_zone burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://alethicode_backend;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
  }

  # === 写操作 / AI 导学 / 管理后台 / 验证码 / 心跳：直透不缓存 ===
  # HIGH-3: 通用 API 限流 10 r/s + burst 20，避免单 IP 把 backend 线程池打满。
  # HIGH-4: X-Forwarded-For 用 $remote_addr 而非 $proxy_add_x_forwarded_for，
  # 直接覆盖（不追加）客户端伪造的 XFF 头。
  location /api/ {
    if (-f /etc/nginx/runtime/maintenance.flag) { return 503; }
    limit_req zone=api_zone burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://alethicode_backend;
    proxy_connect_timeout 5s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
  }

  # === WebSocket ===
  location /ws/ {
    if (-f /etc/nginx/runtime/maintenance.flag) { return 503; }
    proxy_pass http://alethicode_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # === 头像等上传资源 ===
  location ^~ /public/avatar/ {
    if (-f /etc/nginx/runtime/maintenance.flag) { return 503; }
    limit_req zone=api_zone burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://alethicode_backend;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # === Service Worker 文件不允许被自身缓存 ===
  location = /sw.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires off;
  }
  location = /registerSW.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  # === 静态资源：30 天 immutable ===
  location ~* \.mjs$ {
    root /usr/share/nginx/html;
    default_type application/javascript;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location /admin/ {
    if (-f /etc/nginx/runtime/maintenance.flag) { return 503; }
    root /usr/share/nginx/html;
    try_files $uri $uri/ /admin/index.html;
  }

  location / {
    if (-f /etc/nginx/runtime/maintenance.flag) { return 503; }
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
