# Alethicode Java backend — k8s Deployment + Service + PDB + HPA.
# 面向阿里云 ACK / 腾讯云 TKE / 华为云 CCE；兼容原生 Kubernetes 1.28+。
#
# 注意事项：
# 1. 在 Redis 共享状态 ADR-0005 落地前，Ingress 必须开 sticky session（见
#    deploy/nginx/tutor-workflow-sticky.conf.example）。
# 2. 所有 secret 走 ExternalSecrets（这里仅占位）；不要在 Deployment 里明文写 key。
# 3. `imagePullSecrets` 对应阿里云 ACR 的 docker-registry secret。

apiVersion: v1
kind: Namespace
metadata:
  name: alethicode
  labels:
    istio-injection: disabled  # 等 mTLS 走 service mesh 后再启用
---
apiVersion: v1
kind: Service
metadata:
  name: alethicode-backend
  namespace: alethicode
  labels:
    app.kubernetes.io/name: alethicode-backend
    app.kubernetes.io/part-of: alethicode
spec:
  selector:
    app.kubernetes.io/name: alethicode-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alethicode-backend
  namespace: alethicode
  labels:
    app.kubernetes.io/name: alethicode-backend
    app.kubernetes.io/part-of: alethicode
spec:
  replicas: 3
  strategy:
    # 滚动更新时保证至少 N-1 副本可用，且最多多出 1 个临时副本
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alethicode-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alethicode-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 45  # 大于 application.yml 的 lifecycle.timeout-per-shutdown-phase=20s
      imagePullSecrets:
        - name: aliyun-acr-secret
      containers:
        - name: backend
          image: registry.cn-hangzhou.aliyuncs.com/alethicode/backend:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: JAVA_OPTS
              value: >-
                -Xms512m -Xmx1536m
                -XX:MaxRAMPercentage=75
                -XX:+UseG1GC
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/tmp/heapdump.hprof
            - name: TUTOR_GRAPH_BASE_URL
              value: http://alethicode-tutor-graph:8100
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger-collector:4318/v1/traces
            - name: OTEL_SAMPLING_PROBABILITY
              value: "0.05"
            - name: OTEL_SERVICE_NAME
              value: alethicode-backend
          # 从 ExternalSecret 注入真实 secret
          envFrom:
            - secretRef:
                name: alethicode-backend-secrets
          lifecycle:
            preStop:
              exec:
                # 给 LB 15s 把 pod 摘出 upstream，同时 Spring 继续消化在飞请求。
                command: ["/bin/sh", "-c", "sleep 15"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            # JVM 启动 + Flyway 迁移可能要 60-90s
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alethicode-backend
  namespace: alethicode
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alethicode-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alethicode-backend
  namespace: alethicode
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alethicode-backend
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
