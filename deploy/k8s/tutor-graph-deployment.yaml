# tutor_graph — 单副本 Deployment (ADR-0005 落地前不支持多副本)。
#
# 关键约束：
#   * `replicas: 1` 且 `strategy: Recreate` 严禁滚动到两个实例，否则 _active_runs
#     状态会在 JVM 进程间分叉。
#   * 资源限制基于 LangGraph checkpoint + LLM call 的内存占用估算，预留到 2Gi。
#   * PDB 设 `minAvailable: 0` 是刻意的 — 单副本时 PDB 不能阻塞节点维护。

apiVersion: v1
kind: Service
metadata:
  name: alethicode-tutor-graph
  namespace: alethicode
  labels:
    app.kubernetes.io/name: tutor-graph
spec:
  selector:
    app.kubernetes.io/name: tutor-graph
  ports:
    - name: http
      port: 8100
      targetPort: 8100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alethicode-tutor-graph
  namespace: alethicode
  labels:
    app.kubernetes.io/name: tutor-graph
spec:
  replicas: 1
  strategy:
    type: Recreate  # 严格禁止多副本
  selector:
    matchLabels:
      app.kubernetes.io/name: tutor-graph
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tutor-graph
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8100"
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: aliyun-acr-secret
      containers:
        - name: tutor-graph
          image: registry.cn-hangzhou.aliyuncs.com/alethicode/tutor-graph:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8100
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: TUTOR_GRAPH_CHECKPOINTER
              value: postgres
            - name: TUTOR_GRAPH_JAVA_TOOL_BASE_URL
              value: http://alethicode-backend:8080
            - name: TUTOR_GRAPH_REACT_ENABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger-collector:4318
            - name: OTEL_SERVICE_NAME
              value: tutor-graph
            - name: DEPLOYMENT_ENVIRONMENT
              value: prod
          envFrom:
            - secretRef:
                name: alethicode-tutor-graph-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 18  # 最多 90s 启动
