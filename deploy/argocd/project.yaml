apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: alethicode
  namespace: argocd
spec:
  description: Alethicode OJ Platform

  sourceRepos:
    - https://github.com/your-org/Alethicode.git

  destinations:
    - namespace: alethicode
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: autoscaling
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    - group: policy
      kind: "*"
