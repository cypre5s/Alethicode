# Alethicode-NFK 消融实验配置（24GB GPU 优化）
# 目标显卡: A100/V100/3090/4090 (24GB VRAM)
# DKT (LSTM) + FoLiBiKT (遗忘线性偏置注意力) + simpleKT (交叉注意力)

seeds: [42, 3407, 2024]
n_folds: 5

variants:
  full:
    experiment_name: "A+B+C_Full"
    use_sparse_attention: true
    use_kt_attention: true

  wo_kt_attn:
    experiment_name: "A+B_wo_KTAttn"
    use_sparse_attention: true
    use_kt_attention: false

  wo_sparse_attn:
    experiment_name: "A+C_wo_SparseAttn"
    use_sparse_attention: false
    use_kt_attention: true

  base:
    experiment_name: "A_only_Base"
    use_sparse_attention: false
    use_kt_attention: false

shared:
  embed_dim: 128
  hidden_dim: 384
  n_heads: 8
  top_k: 20
  n_kt_heads: 4
  dropout: 0.2
  max_seq_len: 200
  learning_rate: 0.0005
  weight_decay: 0.01
  batch_size: 1024
  max_epochs: 200
  patience: 30
  grad_clip: 1.0
  lambda_kt: 1.0
