name: CI

# 中国大陆 CI 最佳实践：
#   * Maven / Pip / npm 依赖下载走阿里云镜像，避免 GFW 导致的偶发超时
#   * 使用阿里云 ACR / 中国内部 mirror 的 image
#   * 构建产物 SBOM 上传（保留 90 天以应对合规审计）

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 用于 SARIF / Dependency review 上传
  security-events: write

jobs:
  backend-java:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Prime Maven mirrors (aliyun)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings>
            <mirrors>
              <mirror>
                <id>aliyun-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven.aliyun.com/repository/central</url>
              </mirror>
              <mirror>
                <id>aliyun-public</id>
                <mirrorOf>*,!central</mirrorOf>
                <url>https://maven.aliyun.com/repository/public</url>
              </mirror>
            </mirrors>
          </settings>
          SETTINGS

      - name: Compile
        working-directory: backend
        run: mvn -B -DskipTests compile

      - name: Unit tests (excluding integration & DB-bound)
        working-directory: backend
        run: |
          mvn -B test -Dtest='!*IntegrationTest,!AITutorWorkflowAdminServiceImplTest'

      - name: Generate JaCoCo report (non-blocking threshold)
        working-directory: backend
        run: mvn -B jacoco:report

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 30

      - name: Publish JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco
          retention-days: 30

  tutor-graph-python:
    name: tutor_graph (FastAPI / LangGraph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/tutor-graph/pyproject.toml

      - name: Install dependencies (aliyun mirror)
        working-directory: services/tutor-graph
        env:
          PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
          PIP_TRUSTED_HOST: mirrors.aliyun.com
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest
        working-directory: services/tutor-graph
        env:
          # Memory checkpointer avoids needing a Postgres for unit tests.
          TUTOR_GRAPH_CHECKPOINTER: memory
          TUTOR_GRAPH_JAVA_TOOL_BASE_URL: http://127.0.0.1:8080
          TUTOR_GRAPH_INTERNAL_SERVICE_KEY: dev-internal-key-for-ci-only-20250101-abc
        run: python -m pytest -q

  nfk-contract-python:
    name: NFK training data contract (Python validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/nfk/requirements.txt

      - name: Install dependencies (aliyun mirror)
        working-directory: research/nfk
        env:
          PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
          PIP_TRUSTED_HOST: mirrors.aliyun.com
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Pytest contract validator + round-trip fixture
        working-directory: research/nfk
        run: python -m pytest tests/test_contract_validator.py -v

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npmmirror)
        working-directory: frontend
        env:
          npm_config_registry: https://registry.npmmirror.com/
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck --if-present

      - name: Unit tests
        working-directory: frontend
        run: npm test --if-present -- --ci

  security:
    name: Security scans (SBOM + Trivy)
    runs-on: ubuntu-latest
    needs: [backend-java, tutor-graph-python, nfk-contract-python]
    steps:
      - uses: actions/checkout@v6

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # GitHub code-scanning ingest
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
