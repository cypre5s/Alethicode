[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alethicode-judge-server"
version = "0.0.1"
description = "Alethicode judge server (in-tree fork of QingdaoU/JudgeServer + Judger)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "SATA" }
authors = [
    { name = "Alethicode" },
]
dependencies = [
    "flask>=3.0,<4.0",
    "gunicorn>=22.0,<24.0",
    "psutil>=5.9,<6.0",
    "requests>=2.31,<3.0",
    "idna>=3.6,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "tomli>=2.0,<3.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["judge_server*"]
exclude = ["tests*", "judger*", "configs*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "sandbox: requires Linux + libseccomp + libjudger.so (skipped on host)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["judger/**", "tests/upstream/**"]
