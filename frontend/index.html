<!DOCTYPE html>
<html>
<head>
  <title>Alethicode</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="renderer" content="webkit" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    .app-loader-frame {
      width: 420px;
      height: 220px;
      border: 0;
      overflow: hidden;
      background: transparent;
    }
  </style>
  <script>
    if (window.navigator.userAgent.indexOf('MSIE ') > 0 &&
      window.confirm('Your browser is not supported, click \'OK\' to update')) {
      window.location = 'http://outdatedbrowser.com'
    }
  </script>
</head>
<body>
  <div id="app-loader" role="status" aria-label="Application is loading">
    <iframe
      class="app-loader-frame"
      src="/static/loader/python-ouroboros-loader.html"
      title="Python Ouroboros Loading Animation"
    ></iframe>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/pages/oj/index.js"></script>
</body>
</html>
