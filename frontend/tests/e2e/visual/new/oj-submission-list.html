:root {
  /* Palette */
  --primary-color: #2563eb;
  /* Blue 600 */
  --primary-hover: #1d4ed8;
  /* Blue 700 */
  --secondary-color: #64748b;
  /* Slate 500 */
  --success-color: #10b981;

  --warning-color: #f59e0b;

  --danger-color: #ef4444;
  /* Red 500 */
  /* Backgrounds */
  --bg-base: #f8fafc;

  --bg-panel: #f1f5f9;
  /* Slate 100 */
  /* Text */
  --text-primary: #0f172a;
  /* Slate 900 */
  --text-secondary: #475569;
  /* Slate 600 */
  --text-disabled: #94a3b8;
  /* Slate 400 */
  /* Borders */
  --border-color: rgba(226, 232, 240, 0.6);
  /* Reduced opacity to 60% for lighter feel, well below "opaque" */
  /* Slate 200 equivalent but with opacity */
  --border-radius-sm: 6px;
  --border-radius-md: 12px;
  --border-radius-lg: 16px;
  /* Shadows - Softened and Low Profile */
  /* sm: 15% opacity, 8px blur */
  --shadow-sm: 0 2px 8px 0 rgba(0, 0, 0, 0.08);
  /* md: 15% opacity, 12px blur */
  --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.12), 0 2px 6px -2px rgba(0, 0, 0, 0.08);
  /* lg: 15-20% opacity, 16px+ blur */
  --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  /* Glassmorphism Utilities */
  --glass-bg: rgba(255, 255, 255, 0.7);
  --glass-border: rgba(255, 255, 255, 0.4);
  --glass-blur: 8px;
  /* Typography */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
}
html {
  background-color: var(--bg-base);
  height: 100%;
}
body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background-color: var(--bg-base);
  color: var(--text-primary);
  min-width: 900px;
  height: 100%;
}
/* Global Reset & Utility Classes */
h1,
h2,
h3,
h4,
h5,
h6 {
  color: var(--text-primary);
  font-weight: 700;
  margin-top: 0;
}
p {
  line-height: 1.6;
  color: var(--text-secondary);
}
.flex-container {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;

  max-width: 100%;
  -ms-flex-pack: distribute;
