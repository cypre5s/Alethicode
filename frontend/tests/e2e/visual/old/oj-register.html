:root {
  /* Palette */
  --primary-color: #2563eb;
  /* Blue 600 */
  --primary-hover: #1d4ed8;
  /* Blue 700 */
  --secondary-color: #64748b;
  /* Slate 500 */
  --success-color: #10b981;
  /* Emerald 500 */
  --warning-color: #f59e0b;
  /* Amber 500 */
  --danger-color: #ef4444;
  /* Red 500 */
  /* Backgrounds */
  --bg-base: #f8fafc;
  /* Slate 50 */
  --bg-card: #ffffff;
  --bg-panel: #f1f5f9;
  /* Slate 100 */
  /* Text */
  --text-primary: #0f172a;
  /* Slate 900 */
  --text-secondary: #475569;
  /* Slate 600 */
  --text-disabled: #94a3b8;
  /* Slate 400 */
  /* Borders */
  --border-color: rgba(226, 232, 240, 0.6);
  /* Reduced opacity to 60% for lighter feel, well below "opaque" */
  /* Slate 200 equivalent but with opacity */
  --border-radius-sm: 6px;
  --border-radius-md: 12px;
  --border-radius-lg: 16px;
  /* Shadows - Softened and Low Profile */
  /* sm: 15% opacity, 8px blur */
  --shadow-sm: 0 2px 8px 0 rgba(0, 0, 0, 0.08);
  /* md: 15% opacity, 12px blur */
  --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.12), 0 2px 6px -2px rgba(0, 0, 0, 0.08);
  /* lg: 15-20% opacity, 16px+ blur */
  --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  /* Glassmorphism Utilities */
  --glass-bg: rgba(255, 255, 255, 0.7);
  --glass-border: rgba(255, 255, 255, 0.4);
  --glass-blur: 8px;
  /* Typography */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
}
html {
  background-color: var(--bg-base);
  height: 100%;
}
body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background-color: var(--bg-base);
  color: var(--text-primary);
  min-width: 900px;
  height: 100%;
}
/* Global Reset & Utility Classes */
h1,
h2,
h3,
h4,
h5,
h6 {
  color: var(--text-primary);
  font-weight: 700;
  margin-top: 0;
}
p {
  line-height: 1.6;
  color: var(--text-secondary);
}
.flex-container {
  display: flex;
  width: 100%;
  max-width: 100%;
  justify-content: space-around;
  align-items: flex-start;
  flex-flow: row nowrap;
}
.section-title {
  font-size: 24px;
  font-weight: 700;
  padding-top: 10px;
  padding-bottom: 24px;
  line-height: 1.2;
  color: var(--text-primary);
  letter-spacing: -0.5px;
}
.separator {
  display: block;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  border: 1px dashed var(--border-color);
}
/* Card Style Wrapper */
.card-base {
  background: var(--bg-card);
  border-radius: var(--border-radius-md);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  transition: box-shadow 0.2s ease;
}
.card-base:hover {
  box-shadow: var(--shadow-md);
}
.oj-captcha {
  display: flex;
  flex-wrap: nowrap;
  justify-content: space-between;
  width: 100%;
  height: 36px;
}
.oj-captcha .oj-captcha-code {
  flex: auto;
}
.oj-captcha .oj-captcha-img {
  margin-left: 10px;
  padding: 3px;
  flex: initial;
  border-radius: var(--border-radius-sm);
}
.oj-relative {
  position: relative;
}
a.emphasis {
  color: var(--text-secondary);
  font-weight: 500;
  transition: color 0.2s;
}
a.emphasis:hover {
  color: var(--primary-color);
}
/* MathJax & Markdown Overrides */
.MathJax {
  outline: 0;
}
.MathJax_Display {
  overflow-x: auto;
  overflow-y: hidden;
}
.markdown-body {
  font-family: var(--font-sans);
  color: var(--text-secondary);
}
.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4 {
  color: #111111;
  font-weight: 400;
}
.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4,
.markdown-body h5,
.markdown-body p {
  margin-bottom: 15px;
  padding: 0;
}
.markdown-body h1 {
  font-size: 28px;
}
.markdown-body h2 {
  font-size: 24px;
}
.markdown-body h3 {
  font-size: 20px;
}
.markdown-body h4 {
  font-size: 18px;
}
.markdown-body h5 {
  font-size: 14px;
}
.markdown-body a {
  color: #0099ff;
  margin: 0;
  padding: 0;
  vertical-align: baseline;
}
.markdown-body ul,
.markdown-body ol {
  padding: 0;
  margin: 10px 20px;
}
.markdown-body ul {
  list-style-type: disc;
}
.markdown-body ol {
  list-style-type: decimal;
}
.markdown-body li {
  line-height: 24px;
}
.markdown-body li ul,
.markdown-body li ul {
  margin-left: 24px;
}
.markdown-body p,
.markdown-body ul,
.markdown-body ol {
  font-size: 16px;
  line-height: 24px;
}
.markdown-body pre {
  padding: 5px 10px;
  white-space: pre-wrap;
  margin-top: 15px;
  margin-bottom: 15px;
  background: #f8f8f9;
  border: 1px dashed #e9eaec;
}
.markdown-body code {
  font-size: 90%;
  padding: 2px 5px;
  margin: 0;
  background-color: rgba(27, 31, 35, 0.05);
  border-radius: 3px;
  line-height: 1.5;
}
.markdown-body pre > code {
  padding: 0;
  margin: 0;
  font-size: 100%;
  word-break: normal;
  white-space: pre;
  background: transparent;
  border: 0;
}
.markdown-body aside {
  display: block;
  float: right;
  width: 390px;
}
.markdown-body blockquote {
  border-left: 3px solid #bbbec4;
  padding-left: 10px;
  margin-top: 10px;
  margin-bottom: 10px;
  color: #7b7b7b;
}
.markdown-body hr {
  width: 540px;
  text-align: left;
  margin: 0 auto 0 0;
  color: #999;
}
.markdown-body table {
  border-collapse: collapse;
  margin: 1em 1em;
  border: 1px solid #ccc;
}
.markdown-body table thead {
  background-color: #eee;
}
.markdown-body table thead td {
  color: #666;
}
.markdown-body table td {
  padding: 0.5em 1em;
  border: 1px solid #ccc;
}
.markdown-body code {
  font-family: var(--font-mono);
  background-color: var(--bg-panel);
  border-radius: 4px;
  padding: 0.2em 0.4em;
  color: var(--primary-color);
}
.markdown-body pre code {
  background-color: transparent;
  padding: 0;
  color: inherit;
}
/* Animations */
@keyframes shimmer {
  0% {
    background-position: -200% 0;
  }
  100% {
    background-position: 200% 0;
  }
}
.skeleton-loading {
  background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
  border-radius: var(--border-radius-sm);
}

.glass-effect {
  background-color: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: relative;
  border: 1px solid rgba(255, 255, 255, 0.2);
}
.glass-effect::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  background-repeat: repeat;
  opacity: 0.05;
  pointer-events: none;
  z-index: -1;
  border-radius: inherit;
}

  from {
    opacity: 0;
    transform: translate(0, 30px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

  transition: all 0.2s ease;
}
.ivu-btn-primary {
  background-color: var(--primary-color);
  border-color: var(--primary-color);
}
.ivu-btn-primary:hover {
  background-color: var(--primary-hover);
  border-color: var(--primary-hover);
}

  border-radius: var(--border-radius-md);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
}
.ivu-card:hover {
  box-shadow: var(--shadow-md);
}
/* Apply interactive hover to other card-like elements */

  border-radius: var(--border-radius-md);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
}

  box-shadow: var(--shadow-md);
}

}

}

}

}

}

}

}
